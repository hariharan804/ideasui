# SonarQube Configuration for IdeasUI
sonar.projectKey=ideasui
sonar.organization=ideas2logic-lab
sonar.projectName=IdeasUI

# Source configuration
sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.stories.tsx,**/coverage/**

# TypeScript configuration
sonar.typescript.tsconfigPaths=tsconfig.json

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality gate
sonar.qualitygate.wait=true
