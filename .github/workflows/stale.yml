name: 'Close Stale Issues'

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Close Stale Issues
        uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          # Issue configuration
          days-before-issue-stale: 30
          days-before-issue-close: 5
          stale-issue-label: 'stale'
          stale-issue-message: |
            Hi! 👋

            This issue has been automatically marked as stale because there has been no recent activity. It will be closed in 5 days if no further activity occurs.

            If this issue is still relevant:
            - Comment with an update on the status
            - Remove the `stale` label

            Thank you for your contributions to IdeasUI!
          close-issue-message: |
            This issue has been automatically closed due to inactivity. If you believe this was closed in error, please feel free to reopen it with additional information.

          # Pull request configuration
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: |
            Hi! 👋

            This pull request has been automatically marked as stale because there has been no recent activity. It will be closed in 7 days if no further activity occurs.

            If you're still working on this:
            - Push new commits or rebase
            - Comment with a status update
            - Remove the `stale` label

          close-pr-message: |
            This pull request has been automatically closed due to inactivity. Feel free to reopen it when you're ready to continue work.

          # Labels that prevent an issue/PR from being marked as stale
          exempt-issue-labels: |
            pinned
            security
            good first issue
            help wanted
            breaking change
            in-progress
          exempt-pr-labels: |
            pinned
            security
            work-in-progress
            do-not-close

          # Don't mark issues/PRs with milestones as stale
          exempt-all-milestones: true

          # Remove stale label when activity occurs
          remove-stale-when-updated: true

          # Limit operations per run to avoid rate limiting
          operations-per-run: 100
