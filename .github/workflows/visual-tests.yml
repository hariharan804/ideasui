name: Visual Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Composite action: Node 22 + pnpm + frozen lockfile
      - name: Setup environment
        uses: ./.github/composite-actions/install

      # Cache Playwright Chromium browser
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-

      - name: Install Playwright Chromium with dependencies
        run: npx playwright install --with-deps chromium

      - name: Build packages before tests
        uses: ./.github/composite-actions/build

      - name: Run visual tests (Chromium)
        run: pnpm run test:visual --project=chromium
        env:
          CI: true

      # Upload artifacts ONLY if tests fail
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
