name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/composite-actions/install

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # 1️⃣ Format Check (Prettier)
      - name: Prettier Check
        run: pnpm run format:check

      # 2️⃣ Type Safety Gate (Public API protection)
      - name: TypeScript Check
        run: pnpm tsc --noEmit

      # 3️⃣ ESLint Check
      - name: ESLint
        run: pnpm run lint
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      # 3.5️⃣ Naming Convention Check
      - name: Check Naming Conventions
        run: pnpm run check-naming

      # 4️⃣ Build Packages (publish safety)
      - name: Build packages
        uses: ./.github/composite-actions/build

      # 5️⃣ Unit Tests
      - name: Run tests
        uses: ./.github/composite-actions/test

      # 6️⃣ Coverage Upload (non-blocking for PRs)
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      # 7️⃣ CI Success Message
      - name: Comment PR Success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🚀 CI Checks Passed\n\nAll automated checks have completed successfully. Ready for review! ✨'
            })
