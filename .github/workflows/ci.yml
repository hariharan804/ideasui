name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/composite-actions/install

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      # 1️⃣ Format Check (Prettier)
      - name: Prettier Check
        run: pnpm run format:check

      # 2️⃣ Build Packages (Must run before lint/typecheck so theme CSS & dist artifacts exist)
      - name: Build packages
        uses: ./.github/composite-actions/build

      # 3️⃣ Type Safety Gate (Parallel workspace typechecking via Turbo)
      - name: TypeScript Check
        run: pnpm run typecheck

      # 4️⃣ ESLint Check
      - name: ESLint
        run: pnpm run lint
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      # 5️⃣ Naming Convention Check
      - name: Check Naming Conventions
        run: pnpm run check-naming

      # 6️⃣ Unit Tests
      - name: Run tests
        uses: ./.github/composite-actions/test

      # 7️⃣ Size Limit Checks
      - name: Run size limit check
        run: pnpm run size

      # 8️⃣ CI Success Message
      - name: Comment PR Success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🚀 CI Checks Passed\n\nAll automated checks have completed successfully. Ready for review! ✨'
            })
