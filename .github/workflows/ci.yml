name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup environment
        continue-on-error: true
        uses: ./.github/composite-actions/install

      - name: Turbo Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # 1️⃣ Format Check (Prettier)
      - name: Prettier Check
        run: pnpm run format:check

      # 2️⃣ Type Safety Gate (Public API protection)
      - name: TypeScript Check
        run: pnpm tsc --noEmit

      # 3️⃣ Build Packages (must run before lint — ESLint resolves theme CSS build artifacts)
      - name: Build packages
        uses: ./.github/composite-actions/build

      # 4️⃣ ESLint Check
      - name: ESLint
        run: pnpm run lint
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      # 4.5️⃣ Naming Convention Check
      - name: Check Naming Conventions
        run: pnpm run check-naming

      # 5️⃣ Size Limit Checks
      - name: Run size limit check
        run: pnpm run size

      # 6️⃣ Unit Tests
      - name: Run tests
        uses: ./.github/composite-actions/test

      # 7️⃣ Coverage Upload (non-blocking for PRs)
      - name: Upload coverage
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # 8️⃣ CI Success Message
      - name: Comment PR Success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🚀 CI Checks Passed\n\nAll automated checks have completed successfully. Ready for review! ✨'
            })
