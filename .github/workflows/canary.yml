name: Canary Release

on:
  pull_request:
    types: [closed, labeled]
    branches: [master]
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to publish (leave empty for all)'
        required: false
        type: string

jobs:
  canary:
    # Run on:
    # 1. PR tagged with 'canary' label
    # 2. Merged PRs tagged with 'canary' label
    # 3. Manual workflow dispatch
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'canary') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'canary')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
      issues: write
      id-token: write # Required for npm provenance
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup environment
        uses: ./.github/composite-actions/install

      - name: Turbo Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build packages
        uses: ./.github/composite-actions/build

      - name: Create canary version
        run: |
          if [ -f .changeset/pre.json ]; then
            pnpm exec changeset pre exit
          fi
          pnpm exec changeset version --snapshot canary

      - name: Publish canary to npm
        run: pnpm exec changeset publish --tag canary
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');

            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;

            // Dynamically discover all public @ideasui packages from the workspace
            const getPackages = () => {
              const packages = [];

              const scanDir = (baseDir) => {
                if (fs.existsSync(baseDir)) {
                  fs.readdirSync(baseDir).forEach(dir => {
                    const pkgPath = path.join(baseDir, dir, 'package.json');
                    if (fs.existsSync(pkgPath)) {
                      const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                      if (pkg.name?.startsWith('@ideasui/') && !pkg.private) {
                        packages.push(pkg.name.replace('@ideasui/', ''));
                      }
                    }
                  });
                }
              };

              scanDir('./packages/components');
              scanDir('./packages/core');

              ['hooks', 'icons', 'utils', 'cli'].forEach(pkgName => {
                const pkgPath = `./packages/${pkgName}/package.json`;
                if (fs.existsSync(pkgPath)) {
                  const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                  if (pkg.name?.startsWith('@ideasui/') && !pkg.private) {
                    packages.push(pkg.name.replace('@ideasui/', ''));
                  }
                }
              });

              return packages;
            };

            const packages = getPackages();
            console.log('Discovered public packages:', packages);

            const canaryVersions = packages.map(pkg => {
              try {
                const version = execSync(`npm view @ideasui/${pkg}@canary version`, {
                  encoding: 'utf8',
                  stdio: ['pipe', 'pipe', 'ignore']
                }).trim();
                return `- \`@ideasui/${pkg}@${version}\``;
              } catch (e) {
                return `- \`@ideasui/${pkg}\` (no canary version)`;
              }
            }).join('\n');

            const comment = `## 🧪 Canary Release Published

            Test these canary versions:

            ${canaryVersions}

            ### Installation
            \`\`\`bash
            pnpm install @ideasui/button@canary @ideasui/theme@canary
            \`\`\`

            ### Testing
            These canary versions are now available for testing.
            `;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
