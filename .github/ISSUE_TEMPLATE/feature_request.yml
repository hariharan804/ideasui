name: Feature Request
description: Suggest a new feature or enhancement for IdeasUI
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out the form below to help us understand your request.

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      description: What type of feature are you requesting?
      options:
        - New Component
        - Component Enhancement
        - New Variant/Prop
        - Developer Experience
        - Documentation
        - Tooling/Build
        - Other
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component (if applicable)
      description: Which component would this feature affect?
      placeholder: e.g., Button, Box, or "New Component Name"

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: Describe the problem or use case...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution
      placeholder: Describe how you'd like this feature to work...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered?
      placeholder: Describe alternative solutions you've considered...

  - type: textarea
    id: examples
    attributes:
      label: Code Examples
      description: Show how this feature would be used
      render: tsx
      placeholder: |
        // Example usage
        <Button variant="new-variant" size="lg">
          Example
        </Button>

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to similar implementations or inspiration
      placeholder: |
        - [Component Library Example](https://example.com)
        - [Design Reference](https://example.com)

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you willing to contribute to this feature?
      options:
        - label: I'm willing to implement this feature
        - label: I'm willing to help with testing
        - label: I'm willing to help with documentation